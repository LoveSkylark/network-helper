services:
  opensearch-example:
    build: mcp/opensearch
    image: opensearch-mcp:local
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_EXAMPLE_URL:-https://opensearch.example.com:9200}
      OPENSEARCH_AUTH_MODE: ${OPENSEARCH_EXAMPLE_AUTH_MODE:-api_key}
      OPENSEARCH_TOKEN: ${OPENSEARCH_EXAMPLE_TOKEN:-}
      OPENSEARCH_USERNAME: ${OPENSEARCH_EXAMPLE_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_EXAMPLE_PASSWORD:-}
      OPENSEARCH_SSL_VERIFY: ${OPENSEARCH_EXAMPLE_SSL_VERIFY:-true}
    networks:
      - opensearch-example-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9900), timeout=3).close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  librechat:
    environment:
      OPENSEARCH_EXAMPLE_TOKEN: ${OPENSEARCH_EXAMPLE_TOKEN:-}
    networks:
      - opensearch-example-net

networks:
  opensearch-example-net: