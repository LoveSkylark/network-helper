name: network-helper

x-mcp-healthcheck-script: &mcp-healthcheck-script |
  import json
  import sys
  from urllib.request import ProxyHandler, Request, build_opener

  url = f"http://127.0.0.1:{sys.argv[1]}/mcp"
  opener = build_opener(ProxyHandler({}))
  payload = json.dumps({
      "jsonrpc": "2.0",
      "id": 1,
      "method": "initialize",
      "params": {
          "protocolVersion": "2025-03-26",
          "capabilities": {},
          "clientInfo": {"name": "healthcheck", "version": "1"},
      },
  }).encode()
  headers = {"Content-Type": "application/json", "Accept": "application/json, text/event-stream"}
  session = None
  try:
      with opener.open(Request(url, data=payload, headers=headers), timeout=5) as response:
          session = response.headers.get("Mcp-Session-Id")
          if response.headers.get_content_type() == "text/event-stream":
              for line in response:
                  if line.startswith(b"data:"):
                      result = json.loads(line[5:])
                      break
              else:
                  raise ValueError("MCP response contained no data event")
          else:
              result = json.load(response)
          if result.get("id") != 1 or not result.get("result", {}).get("serverInfo", {}).get("name"):
              raise ValueError("Invalid MCP initialize response")
  finally:
      if session:
          request = Request(url, headers={"Mcp-Session-Id": session}, method="DELETE")
          with opener.open(request, timeout=2):
              pass

x-mcp-healthcheck: &mcp-healthcheck
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  traefik:
    image: traefik:v3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=network-helper-proxy-net"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=acme-dns"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=8.8.8.8:53,1.1.1.1:53"
    ports:
      - "443:443"
    environment:
      ACME_DNS_API_BASE: ${ACME_DNS_API_BASE}
      ACME_DNS_STORAGE_PATH: /etc/traefik/acme-dns-account.json
    volumes:
      - type: bind
        source: ${TRAEFIK_DOCKER_SOCKET}
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ${ACME_DNS_ACCOUNT_FILE}
        target: /etc/traefik/acme-dns-account.json
        read_only: true
      - traefik-acme-data:/letsencrypt
    networks:
      - proxy-net
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  librechat:
    image: ghcr.io/librechat-ai/librechat:v0.8.8
    container_name: librechat
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      CONFIG_PATH: /app/librechat.yaml
      MONGO_URI: "mongodb://librechat:${MONGO_ROOT_PASSWORD}@mongodb:27017/LibreChat?authSource=admin"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      RAG_API_URL: http://rag-api:8000
      DOMAIN_CLIENT: "https://${LIBRECHAT_HOSTNAME}"
      DOMAIN_SERVER: "https://${LIBRECHAT_HOSTNAME}"
      ALLOW_EMAIL_LOGIN: ${ALLOW_EMAIL_LOGIN:-true}
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: ${ALLOW_SOCIAL_LOGIN:-false}
      OPENID_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      OPENID_ISSUER: "https://login.microsoftonline.com/${MICROSOFT_CLIENT_TENANT_ID}/v2.0"
      OPENID_SESSION_SECRET: ${OPENID_SESSION_SECRET}
      OPENID_SCOPE: "openid profile email"
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_BUTTON_LABEL: "Sign in with Microsoft"
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LITELLM_VIRTUAL_KEY: ${LITELLM_VIRTUAL_KEY}
    labels:
      traefik.enable: "true"
      traefik.docker.network: network-helper-proxy-net
      traefik.http.routers.librechat.rule: "Host(`${LIBRECHAT_HOSTNAME}`)"
      traefik.http.routers.librechat.entrypoints: websecure
      traefik.http.routers.librechat.tls: "true"
      traefik.http.routers.librechat.tls.certresolver: letsencrypt
      traefik.http.services.librechat.loadbalancer.server.port: "3080"
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-data:/app/data
      - librechat-uploads:/app/uploads
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      litellm-key-init:
        condition: service_completed_successfully
    networks:
      - librechat-data-net
      - proxy-net
      - gateway-client-net
      - fortios-net
      - opensearch-net
      - cisco-aci-net
      - netbox-net
      - librenms-net
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20
    environment:
      MONGO_INITDB_ROOT_USERNAME: librechat
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    command: ["mongod", "--auth"]
    networks:
      - librechat-data-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep -q 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - librechat-data-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: librechat
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    networks:
      - librechat-data-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5

  rag-api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    environment:
      DB_HOST: vectordb
      DB_PORT: "5432"
      POSTGRES_DB: librechat
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_PORT: "8000"
      EMBEDDINGS_PROVIDER: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      EMBEDDINGS_MODEL: ${OLLAMA_EMBEDDING_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vectordb:
        condition: service_healthy
    networks:
      - librechat-data-net
      - ollama-net
    restart: unless-stopped

  copilot-adapter:
    build: copilot-adapter
    image: network-helper-copilot-adapter:local
    environment:
      COPILOT_AUTH_MODE: ${COPILOT_AUTH_MODE:-github_app}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      COPILOT_APP_ID: ${COPILOT_APP_ID:-}
      COPILOT_INSTALLATION_ID: ${COPILOT_INSTALLATION_ID:-}
      COPILOT_APP_PRIVATE_KEY_B64: ${COPILOT_APP_PRIVATE_KEY_B64:-}
      COPILOT_ADAPTER_API_KEY: ${COPILOT_ADAPTER_API_KEY}
      ALLOW_COPILOT_MCP: ${ALLOW_COPILOT_MCP:-false}
    networks:
      - litellm-upstream-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.4.2-alpine
    environment:
      STABLEMASK_REDIS_PASSWORD: ${STABLEMASK_REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${STABLEMASK_REDIS_PASSWORD}"]
    volumes:
      - stablemask-redis-data:/data
    networks:
      - litellm-upstream-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${STABLEMASK_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    networks:
      - litellm-upstream-net
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    networks:
      - litellm-upstream-net
    restart: unless-stopped

  litellm-db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - litellm-db-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5

  litellm:
    build:
      context: .
      dockerfile: litellm/Dockerfile
    image: network-helper-litellm:local
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      COPILOT_ADAPTER_API_KEY: ${COPILOT_ADAPTER_API_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_API_BASE_URL: ${OLLAMA_API_BASE_URL}
      LOCAL_MODEL_NAME: local-ollama
      ALLOW_COPILOT_MCP: ${ALLOW_COPILOT_MCP:-false}
      STABLEMASK_HMAC_KEY: ${STABLEMASK_HMAC_KEY}
      STABLEMASK_REDIS_URL: "redis://:${STABLEMASK_REDIS_PASSWORD}@redis:6379/0"
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      copilot-adapter:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    networks:
      - gateway-client-net
      - litellm-upstream-net
      - ollama-net
      - litellm-db-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  litellm-key-init:
    image: network-helper-litellm:local
    pull_policy: never
    entrypoint: ["python", "/app/create_virtual_key.py"]
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_VIRTUAL_KEY: ${LITELLM_VIRTUAL_KEY}
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - gateway-client-net
    restart: "no"

  fortios-mcp:
    build: fortigate-mcp
    image: fortios-mcp:local
    environment:
      FORTIOS_HOST: ${FORTIOS_HOST}
      FORTIOS_API_TOKEN: ${FORTIOS_API_TOKEN}
      FORTIOS_VDOM: ${FORTIOS_VDOM}
      FORTIOS_VERIFY_SSL: ${FORTIOS_VERIFY_SSL}
      FORTIOS_TIMEOUT: ${FORTIOS_TIMEOUT}
      MCP_TRANSPORT: "streamable-http"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
    stdin_open: true
    networks:
      - fortios-net
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", *mcp-healthcheck-script, "8000"]

  opensearch-mcp:
    build: opensearch-mcp
    image: opensearch-mcp:local
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_SSL_VERIFY: ${OPENSEARCH_SSL_VERIFY}
    networks:
      - opensearch-net
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", *mcp-healthcheck-script, "9900"]

  # cisco-ise-mcp:
  #   build: cisco-ise-mcp
  #   image: cisco-ise-mcp:local
  #   environment:
  #     ISE_IP: ${ISE_IP}
  #     API_USERNAME: ${API_USERNAME}
  #     API_PWD: ${API_PWD}
  #     ISE_VERIFY_SERVER_CERT: ${ISE_VERIFY_SERVER_CERT}
  #     ISE_VERIFY_HOSTNAME: ${ISE_VERIFY_HOSTNAME}
  #     DEBUG_MCP: ${DEBUG_MCP}
  #   networks:
  #     - cisco-ise-net
  #   restart: unless-stopped
  #   healthcheck:
  #     <<: *mcp-healthcheck
  #     test: ["CMD", "python", "-c", *mcp-healthcheck-script, "5000"]

  cisco-aci-mcp:
    build: cisco-aci-mcp
    image: cisco-aci-mcp:local
    environment:
      APIC_URL: ${APIC_URL}
      USERNAME: ${ACI_USERNAME}
      PASSWORD: ${ACI_PASSWORD}
    networks:
      - cisco-aci-net
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", *mcp-healthcheck-script, "8000"]

  netbox-mcp:
    build: netbox-mcp
    image: netbox-mcp:local
    environment:
      NETBOX_URL: ${NETBOX_URL}
      NETBOX_TOKEN: ${NETBOX_TOKEN}
      VERIFY_SSL: ${NETBOX_VERIFY_SSL}
      TRANSPORT: "http"
      HOST: "0.0.0.0"
      PORT: "8000"
    networks:
      - netbox-net
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", *mcp-healthcheck-script, "8000"]

  librenms-mcp:
    build: librenms-mcp
    image: librenms-mcp:local
    environment:
      LIBRENMS_URL: ${LIBRENMS_URL}
      LIBRENMS_TOKEN: ${LIBRENMS_TOKEN}
      LIBRENMS_VERIFY_SSL: ${LIBRENMS_VERIFY_SSL}
      READ_ONLY_MODE: "true"
      TOOL_SEARCH_ENABLED: "true"
      MCP_TRANSPORT: "http"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8000"
    networks:
      - librenms-net
    restart: unless-stopped
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", *mcp-healthcheck-script, "8000"]

networks:
  librechat-data-net:
    internal: true
  proxy-net:
    name: network-helper-proxy-net
  gateway-client-net:
  litellm-upstream-net:
  ollama-net:
  litellm-db-net:
    internal: true
  fortios-net:
  opensearch-net:
  cisco-ise-net:
  cisco-aci-net:
  netbox-net:
  librenms-net:

volumes:
  traefik-acme-data:
  librechat-data:
  librechat-uploads:
  librechat-images:
  librechat-logs:
  mongodb-data:
  meilisearch-data:
  rag-postgres-data:
  litellm-db-data:
  stablemask-redis-data:
